        body::after  { width: 58vw; height: 58vw; background: radial-gradient(ellipse at center, rgba(0,148,220,0.15) 0%, transparent 68%); bottom: -22%; right: -18%; animation: bb2 16s ease-in-out infinite alternate; }
        @keyframes bb1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(8vw,6vh) scale(1.2); } }
        @keyframes bb2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-5vw,-8vh) scale(1.12); } }

        const manifest = {

                {

                    "title": "Common Ground",

                    "content": {
                        "sections": [
                            {
                                "title": "Common Ground",
                                "content": "<p>Psychedelics and cyberdelics share remarkable common ground. Before we explore their differences, it's essential to understand what they have in common. This isn't about competition between two opposing approaches, it's about recognizing two paths toward similar destinations. The differences only make sense once you've seen what they're both aiming at.</p>",
                                "triggerLabel": "Shared Intention"
                            },
                            {
                                "title": "Shared Intention",
                                "media": {
                                    "type": "image",
                                    "src": "../Module_1_DefiningCyberdelics/Lesson_2_PsychedelicsVsCyberdelics/../assets/images/module1/SharedIntention.webp"
                                },
                                "mediaLayout": "left",
                                "content": "<p>Both psychedelics and cyberdelics exist for the same fundamental purpose. facilitating consciousness exploration, personal transformation, and spiritual development. Whether using substances or technology, the underlying intention is identical, to expand awareness, facilitate healing, and support personal growth. Purpose is the foundation both fields share.</p>",
                                "triggerLabel": "Shared Outcomes"
                            },
                            {
                                "title": "Shared Outcomes",
                                "content": "<p>Research shows that both approaches can produce similar outcomes. Mystical experiences, therapeutic breakthroughs, perspective shifts, emotional healing, and spiritual insights can occur through either path. The phenomenology, what people actually experience, can be remarkably similar. Different roads, recognizable destination.</p>",
                                "triggerLabel": "Research Validation"
                            },
                            {
                                "title": "Research Validation",
                                "content": "<p>Studies comparing traditional psychedelic experiences with properly designed cyberdelic experiences show comparable scores on measures of mystical experience, ego dissolution, and therapeutic benefit. Both approaches can facilitate profound shifts in consciousness when done intentionally and skillfully. Technology isn't a lesser substitute, it's a parallel path.</p>",
                                "triggerLabel": "Explore the Spectrum"
                            }
                        ]
                    }
                }
            ]
        };

        LessonRunner.init('#lesson-root');
        LessonRunner.loadLesson(manifest);
    </script>
