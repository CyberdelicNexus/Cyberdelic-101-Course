<html lang="en">
<head>

    <title>M1L2 — Overview</title>

    <link rel="stylesheet" href="../../methods/option-selector/option-selector.css">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; height: 100vh; overflow: hidden; background: #03010f; position: relative; }
        #lesson-root { width: 100%; height: 100%; position: relative; z-index: 1; }
        body::before, body::after { content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
        body::before { width: 72vw; height: 72vw; background: radial-gradient(ellipse at center, rgba(89,0,200,0.24) 0%, transparent 68%); top: -28%; left: -22%; animation: bb1 12s ease-in-out infinite alternate; }
        body::after  { width: 58vw; height: 58vw; background: radial-gradient(ellipse at center, rgba(0,148,220,0.15) 0%, transparent 68%); bottom: -22%; right: -18%; animation: bb2 16s ease-in-out infinite alternate; }
        @keyframes bb1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(8vw,6vh) scale(1.2); } }
        @keyframes bb2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-5vw,-8vh) scale(1.12); } }
    </style>
</head>
<body>
    <div id="lesson-root"></div>

    <script src="../../core/method-base.js"></script>
    <script src="../../methods/option-selector/option-selector.js"></script>
    <script src="../../core/lesson-runner.js"></script>

    <script>
        const manifest = {
            "id": "m1l2_quiz",
            "lessonId": "m1_l2_quiz",
            "title": "Module 1 Lesson 2 Overview",
            "theme": { "primaryColor": "#5900ff", "fontBody": "Rajdhani, sans-serif" },
            "modules": [
                {
                    "id": "quiz_1.2_combined",
                    "title": "Module 1 Lesson 2 Overview",
                    "type": "option-selector",
                    "config": {
                        "mode": "single",
                        "style": "text",
                        "questions": [
                            {
                                "question": "What do psychedelics and cyberdelics primarily share?",
                                "options": [
                                    {"id":"q1_1_a","label":"The specific method used","correct":false},
                                    {"id":"q1_1_c","label":"Legal status","correct":false},
                                    {"id":"q1_1_b","label":"The intention to facilitate transformation","correct":true},
                                    {"id":"q1_1_d","label":"Requirement for medical supervision","correct":false}
                                ],
                                "synthesis": {
                                    "q1_1_a": "<p>The method is actually where they differ. Psychedelics use chemical substances, while cyberdelics use digital technology. What they share is the intention and potential outcomes. <strong>Try again.</strong></p>",
                                    "q1_1_c": "<p>Legal status is actually where they differ significantly. What they share is transformational intent and potential outcomes, not legal status. <strong>Try again.</strong></p>",
                                    "q1_1_d": "<p>Medical supervision requirements differ between the two approaches. What they share is transformational purpose, not supervision requirements. <strong>Try again.</strong></p>",
                                    "q1_1_b": "<h3>Correct!</h3><p>Exactly. Both psychedelics and cyberdelics share the core intention of facilitating consciousness exploration, personal transformation, and spiritual development. The method differs (substances vs. technology), but the purpose aligns.</p>"
                                }
                            },
                            {
                                "question": "Can properly designed cyberdelic experiences produce mystical experiences comparable to psychedelics?",
                                "options": [
                                    {"id":"q1_2_a","label":"No, only substances work","correct":false},
                                    {"id":"q1_2_c","label":"Maybe, but less profound","correct":false},
                                    {"id":"q1_2_d","label":"Depends on belief system","correct":false},
                                    {"id":"q1_2_b","label":"Yes, research shows comparable scores","correct":true}
                                ],
                                "synthesis": {
                                    "q1_2_a": "<p>Research shows this isn't accurate. Studies comparing psychedelic and cyberdelic experiences demonstrate that properly designed cyberdelic protocols can produce mystical experiences with comparable intensity and outcomes. <strong>Try again.</strong></p>",
                                    "q1_2_c": "<p>Research doesn't support the idea that cyberdelic experiences are inherently less profound. Profundity depends on design quality and context, not the medium itself. <strong>Try again.</strong></p>",
                                    "q1_2_d": "<p>While belief and expectation play roles, research shows cyberdelic experiences can produce measurable mystical phenomena regardless of prior beliefs. <strong>Try again.</strong></p>",
                                    "q1_2_b": "<h3>Correct!</h3><p>Empirical research demonstrates that well-designed cyberdelic experiences can produce mystical experiences, ego dissolution, and therapeutic breakthroughs comparable to traditional psychedelics, validated through standardized measures of mystical experience.</p>"
                                }
                            },
                            {
                                "question": "Which aspect primarily DIFFERS between psychedelics and cyberdelics?",
                                "options": [
                                    {"id":"q2_1_b","label":"The method used to create the experience","correct":true},
                                    {"id":"q2_1_a","label":"The intention to facilitate transformation","correct":false},
                                    {"id":"q2_1_c","label":"The potential for mystical experiences","correct":false},
                                    {"id":"q2_1_d","label":"The need for integration and processing afterward","correct":false}
                                ],
                                "synthesis": {
                                    "q2_1_a": "<p>Intention is actually what they share, not what differs. Both exist to facilitate consciousness exploration and personal transformation. <strong>Try again.</strong></p>",
                                    "q2_1_c": "<p>Both approaches can facilitate mystical experiences — this is what they share, not what differs. <strong>Try again.</strong></p>",
                                    "q2_1_d": "<p>Integration is important for both approaches. This is a shared characteristic, not a difference. <strong>Try again.</strong></p>",
                                    "q2_1_b": "<h3>Correct!</h3><p>Exactly. The primary difference is the method — psychedelics use chemical substances to alter consciousness, while cyberdelics use digital technology. This methodological difference creates practical distinctions in legality, safety profiles, and control, but the core transformational intention remains the same.</p>"
                                }
                            },
                            {
                                "question": "Why might someone choose cyberdelics over psychedelics for consciousness exploration?",
                                "options": [
                                    {"id":"q2_2_a","label":"Because cyberdelics are always more powerful and effective","correct":false},
                                    {"id":"q2_2_c","label":"Because technology is more spiritual than chemistry","correct":false},
                                    {"id":"q2_2_b","label":"Medical contraindications, legal considerations, or personal preference","correct":true},
                                    {"id":"q2_2_d","label":"To avoid all risks and challenges","correct":false}
                                ],
                                "synthesis": {
                                    "q2_2_a": "<p>Neither approach is universally more powerful or effective — they're different tools for different contexts. <strong>Try again.</strong></p>",
                                    "q2_2_c": "<p>Neither method is inherently more or less spiritual. Spirituality emerges from intention and experience, not from the medium used. <strong>Try again.</strong></p>",
                                    "q2_2_d": "<p>While cyberdelics have different safety considerations, consciousness exploration through any method involves psychological and emotional challenges. Cyberdelics aren't risk-free — they're differently safe. <strong>Try again.</strong></p>",
                                    "q2_2_b": "<h3>Quiz Complete!</h3><p>Exactly. People might choose cyberdelics for various valid reasons — health conditions, legal restrictions, preference for repeatable and controllable experiences, or genuine resonance with technological approaches. Different paths serve different needs. <strong>Quiz Complete.</strong></p>"
                                }
                            }
                        ]
                    }
                }
            ]
        };

        LessonRunner.init('#lesson-root');
        LessonRunner.loadLesson(manifest);
    </script>
</body>
</html>
