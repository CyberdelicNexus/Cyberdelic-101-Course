<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Base ── */
        body {
            font-family: 'Poppins', sans-serif;
            background: #03010f;
            color: #e8e8f0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Animated blob backgrounds ── */
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 0;
        }
        body::before {
            width: 72vw; height: 72vw;
            background: radial-gradient(ellipse at center, rgba(89,0,200,0.22) 0%, transparent 68%);
            top: -28%; left: -22%;
            animation: bb1 12s ease-in-out infinite alternate;
        }
        body::after {
            width: 58vw; height: 58vw;
            background: radial-gradient(ellipse at center, rgba(89,0,200,0.14) 0%, transparent 68%);
            bottom: -22%; right: -18%;
            animation: bb2 16s ease-in-out infinite alternate;
        }
        @keyframes bb1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(8vw,6vh) scale(1.2); } }
        @keyframes bb2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-5vw,-8vh) scale(1.12); } }

        /* ── Root ── */
        #feedback-root { position: relative; z-index: 2; width: 100%; height: 100vh; }

        /* ── Page wrapper ── */
        .fb-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            animation: fb-page-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fb-page-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Rotating border card ── */
        @property --border-angle {
            syntax: '<angle>'; inherits: false; initial-value: 0deg;
        }
        @keyframes border-rotate { to { --border-angle: 360deg; } }

        .fb-card {
            --border-angle: 0deg;
            background:
                linear-gradient(rgba(10, 7, 28, 1), rgba(10, 7, 28, 1)) padding-box,
                conic-gradient(from var(--border-angle) at 50% 50%,
                    rgba(80,40,180,0) 0%,
                    rgba(80,40,180,0) 62%,
                    rgba(145,100,255,0.75) 74%,
                    rgba(205,175,255,0.95) 81%,
                    rgba(145,100,255,0.75) 88%,
                    rgba(80,40,180,0) 100%
                ) border-box;
            border: 1.5px solid transparent;
            border-radius: 20px;
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 1px 0 rgba(255,255,255,0.08) inset,
                0 0 80px rgba(89,0,200,0.08);
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 600px;
            max-height: calc(100vh - 64px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(130,90,255,0.35) transparent;
            animation: border-rotate 14s linear infinite;
        }

        /* ── Eyebrow ── */
        .fb-eyebrow {
            font-size: 0.67rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(190,165,255,0.6);
            margin-bottom: 0.5rem;
        }

        /* ── Title ── */
        .fb-title {
            font-size: clamp(1.3rem, 3vw, 1.75rem);
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        .fb-subtitle {
            font-size: 0.88rem;
            color: rgba(190,185,220,0.55);
            margin-bottom: 1.75rem;
        }

        /* ── Divider ── */
        .fb-divider {
            border: none;
            border-top: 1px solid rgba(130,90,255,0.12);
            margin-bottom: 1.5rem;
        }

        /* ── Field wrapper ── */
        .fb-field { margin-bottom: 1.5rem; }

        /* ── Labels ── */
        .fb-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(220,215,248,0.9);
            margin-bottom: 0.65rem;
        }
        .fb-optional {
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(160,155,200,0.5);
        }

        /* ── Rating row ── */
        .fb-rating-wrap { display: flex; flex-direction: column; gap: 0.45rem; }

        .fb-rating-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .fb-rating-btn {
            flex: 1;
            height: 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(130,90,255,0.2);
            border-radius: 8px;
            color: rgba(200,195,240,0.7);
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .fb-rating-btn:hover {
            background: rgba(130,90,255,0.1);
            border-color: rgba(130,90,255,0.4);
            color: #fff;
        }
        .fb-rating-btn.active {
            background: rgba(130,90,255,0.22);
            border-color: rgba(190,165,255,0.7);
            color: #fff;
            box-shadow: 0 0 14px rgba(130,90,255,0.25);
        }

        .fb-rating-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: rgba(160,155,200,0.45);
            letter-spacing: 0.3px;
            padding: 0 2px;
        }

        /* ── Textareas ── */
        .fb-textarea {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(130,90,255,0.18);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            color: rgba(220,215,248,0.92);
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .fb-textarea::placeholder { color: rgba(140,135,180,0.4); }
        .fb-textarea:focus {
            border-color: rgba(130,90,255,0.45);
            box-shadow: 0 0 0 3px rgba(130,90,255,0.08);
        }

        /* ── Error ── */
        .fb-error {
            font-size: 0.78rem;
            color: rgba(255,100,100,0.85);
            margin-bottom: 0.75rem;
            display: none;
        }
        .fb-error.visible { display: block; }

        /* ── Submit button ── */
        .fb-submit {
            display: block;
            width: 100%;
            padding: 0.8rem 2rem;
            background: transparent;
            border: 1.5px solid rgba(130,90,255,0.5);
            border-radius: 100px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 16px rgba(130,90,255,0.1);
        }
        .fb-submit:hover:not(:disabled) {
            background: rgba(130,90,255,0.12);
            border-color: rgba(190,165,255,0.85);
            box-shadow: 0 0 24px rgba(130,90,255,0.28);
            transform: translateY(-1px);
        }
        .fb-submit:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .fb-submit.loading {
            opacity: 0.6;
            cursor: wait;
        }

        /* ── Success screen ── */
        .fb-success-page {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            animation: fb-page-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
            z-index: 10;
        }
        .fb-success-page.visible { display: flex; }

        @keyframes lc-icon-pulse {
            0%, 100% { box-shadow: 0 0 16px rgba(130,90,255,0.3), inset 0 0 12px rgba(130,90,255,0.1); opacity: 0.8; }
            50% { box-shadow: 0 0 36px rgba(130,90,255,0.55), inset 0 0 20px rgba(130,90,255,0.2); opacity: 1; }
        }

        .fb-success-icon {
            width: 68px; height: 68px;
            border-radius: 50%;
            border: 1.5px solid rgba(190,165,255,0.45);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            color: rgba(210,190,255,0.85);
            margin-bottom: 1.5rem;
            animation: lc-icon-pulse 3s ease-in-out infinite;
        }

        .fb-success-title {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .fb-success-sub {
            font-size: 0.95rem;
            color: rgba(190,185,220,0.65);
            max-width: 380px;
            line-height: 1.65;
        }

        /* ── Scrollbar ── */
        .fb-card::-webkit-scrollbar { width: 6px; }
        .fb-card::-webkit-scrollbar-track { background: transparent; }
        .fb-card::-webkit-scrollbar-thumb { background: rgba(130,90,255,0.3); border-radius: 3px; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .fb-page { padding: 1.25rem; }
            .fb-card { padding: 1.5rem 1.25rem; }
        }

        /* ── Motion + icons (same vocabulary as the quiz and scenario pages:
              Academy gradient orbit, violet core, drawn strokes) ── */
        :root {
            --fx-from: #DBAB40;
            --fx-to: #CADE77;
            --fx-glow: rgba(110,60,255,0.22);
            --fx-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fx-icon { width: 16px; height: 16px; flex-shrink: 0; color: rgba(210,190,255,0.85); }
        .fx-icon .fx-node { fill: var(--fx-to); stroke: none; }

        .fb-emblem { position: relative; width: 56px; height: 56px; margin-bottom: 1rem; display: grid; place-items: center; }
        .fb-emblem svg.fx-rings { position: absolute; inset: 0; overflow: visible; }
        .fx-ring-outer, .fx-ring-inner, .fx-core { transform-box: view-box; transform-origin: 50% 50%; }
        .fx-ring-outer { animation: fx-spin 24s linear infinite; }
        .fx-ring-inner { animation: fx-spin 36s linear infinite reverse; }
        .fx-core { fill: var(--fx-glow); animation: fx-breathe 4.8s ease-in-out infinite; }
        .fb-emblem .fx-icon { position: relative; width: 22px; height: 22px; color: rgba(236,228,255,0.95); }
        @keyframes fx-spin { to { transform: rotate(360deg); } }
        @keyframes fx-breathe { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }

        .fb-label { display: flex; align-items: center; gap: 0.5rem; }
        .fb-card > * { animation: fx-rise 0.6s var(--fx-ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
        @keyframes fx-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        /* Ratings light up to the chosen value; the chosen one pulses once */
        .fb-rating-btn { position: relative; }
        .fb-rating-btn.lit {
            border-color: rgba(219,171,64,0.55);
            background: linear-gradient(135deg, rgba(219,171,64,0.14), rgba(202,222,119,0.10));
            color: #fff;
        }
        .fb-rating-btn.active { animation: fx-pop 0.45s var(--fx-ease); }
        .fb-rating-btn.active::after {
            content: ''; position: absolute; inset: -2px; border-radius: inherit;
            border: 1.5px solid var(--fx-to); opacity: 0; pointer-events: none;
            animation: fx-ring 0.7s var(--fx-ease);
        }
        @keyframes fx-pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes fx-ring { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.5); } }

        .fb-textarea:focus { box-shadow: 0 0 0 1px rgba(190,165,255,0.25), 0 0 24px rgba(130,90,255,0.18); }

        .fb-submit { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; }
        .fb-submit::before {
            content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
            background: linear-gradient(90deg, transparent, rgba(202,222,119,0.16), transparent);
            animation: fx-sheen 3.6s ease-in-out infinite; pointer-events: none;
        }
        @keyframes fx-sheen { 0%, 55% { left: -60%; } 100% { left: 130%; } }
        .fb-submit .fx-spinner { display: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); border-top-color: var(--fx-to); animation: fx-spin 0.8s linear infinite; }
        .fb-submit.loading .fx-spinner { display: inline-block; }

        /* Success: rings converge, the check draws, sparks scatter */
        .fb-success-icon { position: relative; border: none; width: 96px; height: 96px; animation: none; }
        .fb-success-icon svg { position: absolute; inset: 0; overflow: visible; }
        .fx-s-ring { transform-box: view-box; transform-origin: 50% 50%; fill: none; }
        .fb-success-page.visible .fx-s-ring { animation: fx-converge 0.9s var(--fx-ease) both; }
        .fb-success-page.visible .fx-s-ring.two { animation-delay: 0.12s; }
        .fx-s-check { fill: none; stroke: var(--fx-to); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
        .fb-success-page.visible .fx-s-check { animation: fx-draw 0.6s 0.55s var(--fx-ease) forwards; }
        .fx-spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--fx-to); opacity: 0; }
        .fb-success-page.visible .fx-spark { animation: fx-burst 1.1s 0.5s var(--fx-ease) both; }
        @keyframes fx-converge { from { transform: scale(1.8) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes fx-draw { to { stroke-dashoffset: 0; } }
        @keyframes fx-burst { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .fx-s-check { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
<div id="feedback-root">

    <!-- Form page -->
    <div class="fb-page" id="fb-form-page">
        <div class="fb-card">
            <div class="fb-emblem" aria-hidden="true">
                <svg class="fx-rings" viewBox="0 0 48 48" width="56" height="56" fill="none">
                    <defs><linearGradient id="fx-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DBAB40"/><stop offset="1" stop-color="#CADE77"/></linearGradient></defs>
                    <g class="fx-ring-outer"><circle cx="24" cy="24" r="22" stroke="url(#fx-grad)" stroke-width="1.25" stroke-dasharray="46 10 8 10" stroke-linecap="round"/><circle cx="24" cy="2" r="1.6" fill="#CADE77"/></g>
                    <g class="fx-ring-inner"><circle cx="24" cy="24" r="16.5" stroke="rgba(190,165,255,0.75)" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/></g>
                    <circle class="fx-core" cx="24" cy="24" r="12"/>
                </svg>
                <svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4A2 2 0 0 1 4 14z"/><circle class="fx-node" cx="9" cy="10" r="0.9"/><circle class="fx-node" cx="12" cy="10" r="0.9"/><circle class="fx-node" cx="15" cy="10" r="0.9"/></svg>
            </div>
            <p class="fb-eyebrow" id="fb-eyebrow">Course Feedback</p>
            <h1 class="fb-title" id="fb-title">How was the course?</h1>
            <p class="fb-subtitle">Your feedback directly shapes what comes next.</p>
            <hr class="fb-divider">

            <!-- Q1: Overall rating -->
            <div class="fb-field">
                <label class="fb-label"><svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/><circle class="fx-node" cx="12" cy="12" r="1"/></svg>Overall experience of this course</label>
                <div class="fb-rating-wrap">
                    <div class="fb-rating-row" id="rating-overall">
                        <button class="fb-rating-btn" data-val="1" data-group="overall">1</button>
                        <button class="fb-rating-btn" data-val="2" data-group="overall">2</button>
                        <button class="fb-rating-btn" data-val="3" data-group="overall">3</button>
                        <button class="fb-rating-btn" data-val="4" data-group="overall">4</button>
                        <button class="fb-rating-btn" data-val="5" data-group="overall">5</button>
                    </div>
                    <div class="fb-rating-labels">
                        <span>Not great</span>
                        <span>Amazing</span>
                    </div>
                </div>
            </div>

            <!-- Q2: Most valuable -->
            <div class="fb-field">
                <label class="fb-label" for="fb-valuable"><svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/><circle class="fx-node" cx="12" cy="12" r="1.4"/></svg>What was most valuable or insightful?</label>
                <textarea class="fb-textarea" id="fb-valuable" rows="3"
                    placeholder="What stuck with you from this module..."></textarea>
            </div>

            <!-- Q3: Confidence rating -->
            <div class="fb-field">
                <label class="fb-label"><svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle class="fx-node" cx="12" cy="16" r="1.4"/></svg>How confident do you feel about the concepts covered?</label>
                <div class="fb-rating-wrap">
                    <div class="fb-rating-row" id="rating-confidence">
                        <button class="fb-rating-btn" data-val="1" data-group="confidence">1</button>
                        <button class="fb-rating-btn" data-val="2" data-group="confidence">2</button>
                        <button class="fb-rating-btn" data-val="3" data-group="confidence">3</button>
                        <button class="fb-rating-btn" data-val="4" data-group="confidence">4</button>
                        <button class="fb-rating-btn" data-val="5" data-group="confidence">5</button>
                    </div>
                    <div class="fb-rating-labels">
                        <span>Still fuzzy</span>
                        <span>Got it</span>
                    </div>
                </div>
            </div>

            <!-- Q4: Improve -->
            <div class="fb-field">
                <label class="fb-label" for="fb-improve">
                    <svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/><circle class="fx-node" cx="6" cy="18" r="0.9"/></svg>
                    What could be clearer or improved?
                    <span class="fb-optional">(optional)</span>
                </label>
                <textarea class="fb-textarea" id="fb-improve" rows="2"
                    placeholder="Any suggestions..."></textarea>
            </div>

            <!-- Q5: Extra -->
            <div class="fb-field">
                <label class="fb-label" for="fb-comments">
                    <svg class="fx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4A2 2 0 0 1 4 14z"/><circle class="fx-node" cx="9" cy="10" r="0.9"/><circle class="fx-node" cx="12" cy="10" r="0.9"/><circle class="fx-node" cx="15" cy="10" r="0.9"/></svg>
                    Anything else on your mind?
                    <span class="fb-optional">(optional)</span>
                </label>
                <textarea class="fb-textarea" id="fb-comments" rows="2"
                    placeholder="Open thoughts, questions, vibes..."></textarea>
            </div>

            <p class="fb-error" id="fb-error">Please rate your overall experience before submitting.</p>
            <button class="fb-submit" id="fb-submit"><span class="fx-spinner" aria-hidden="true"></span><span class="fb-submit-text">Submit Feedback</span></button>
        </div>
    </div>

    <!-- Success page -->
    <div class="fb-success-page" id="fb-success-page">
        <div class="fb-success-icon" aria-hidden="true">
            <svg viewBox="0 0 96 96" width="96" height="96">
                <defs><linearGradient id="fx-grad-s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DBAB40"/><stop offset="1" stop-color="#CADE77"/></linearGradient></defs>
                <circle class="fx-s-ring" cx="48" cy="48" r="44" stroke="url(#fx-grad-s)" stroke-width="1.5" stroke-dasharray="80 12 16 12"/>
                <circle class="fx-s-ring two" cx="48" cy="48" r="34" stroke="rgba(190,165,255,0.6)" stroke-width="1" stroke-dasharray="2 5"/>
                <circle cx="48" cy="48" r="24" fill="rgba(110,60,255,0.22)"/>
                <path class="fx-s-check" d="M37 49l7.5 7.5L60 41"/>
            </svg>
            <span class="fx-spark" style="--dx:0px;--dy:-62px"></span><span class="fx-spark" style="--dx:44px;--dy:-44px"></span><span class="fx-spark" style="--dx:62px;--dy:0px"></span><span class="fx-spark" style="--dx:44px;--dy:44px"></span><span class="fx-spark" style="--dx:0px;--dy:62px"></span><span class="fx-spark" style="--dx:-44px;--dy:44px"></span><span class="fx-spark" style="--dx:-62px;--dy:0px"></span><span class="fx-spark" style="--dx:-44px;--dy:-44px"></span>
        </div>
        <h1 class="fb-success-title">Thank you</h1>
        <p class="fb-success-sub" id="fb-success-sub">Your feedback helps make this course better for everyone who comes next.</p>
    </div>

</div>

<script>
(function () {
    'use strict';

    /* ── Canvas dot grid (same as lesson embeds) ── */
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;';
    document.body.prepend(canvas);
    const ctx = canvas.getContext('2d');
    const mouse = { x: -9999, y: -9999 };
    const GRID = 44, GLOW_R = 160;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize);
    document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    const drawGrid = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cols = Math.ceil(canvas.width / GRID) + 1;
        const rows = Math.ceil(canvas.height / GRID) + 1;
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                const x = i * GRID, y = j * GRID;
                const dist = Math.hypot(x - mouse.x, y - mouse.y);
                const t = Math.max(0, 1 - dist / GLOW_R);
                ctx.beginPath();
                ctx.arc(x, y, 1.2 + t * 2.4, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(130,90,255,${(0.05 + t * 0.3).toFixed(2)})`;
                ctx.fill();
            }
        }
        requestAnimationFrame(drawGrid);
    };
    resize(); drawGrid();

    /* ── Course detection ── */
    const COURSE_MAP = {
        '3': {
            key:     'cyberdelic_foundations',
            name:    'Cyberdelic Foundations',
            tagline: 'Your feedback helps make Cyberdelic Foundations better for everyone who comes next.'
        },
        '5': {
            key:     'cyberdelics_101',
            name:    'Cyberdelic Foundation Pt2',
            tagline: 'Your feedback helps make Cyberdelic Foundation Pt2 better for everyone who comes next.'
        }
    };
    const params = new URLSearchParams(window.location.search);
    const moduleNum = params.get('module') || '3';
    const course = COURSE_MAP[moduleNum] || COURSE_MAP['3'];
    Array.prototype.forEach.call(document.querySelectorAll('.fb-card > *'), (el, i) => el.style.setProperty('--i', i));
    document.getElementById('fb-eyebrow').textContent = course.name;
    document.getElementById('fb-title').textContent   = `How was ${course.name}?`;
    document.getElementById('fb-success-sub').textContent = course.tagline;

    /* ── Rating buttons ── */
    const ratings = { overall: 0, confidence: 0 };

    document.querySelectorAll('.fb-rating-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const group = btn.dataset.group;
            const val = parseInt(btn.dataset.val, 10);
            ratings[group] = val;

            // Update visual state for this group
            document.querySelectorAll(`.fb-rating-btn[data-group="${group}"]`).forEach(b => {
                const v = parseInt(b.dataset.val, 10);
                b.classList.remove('active');
                b.classList.toggle('lit', v <= val);
                if (v === val) { void b.offsetWidth; b.classList.add('active'); }
            });

            // Clear error if overall was just set
            if (group === 'overall') {
                document.getElementById('fb-error').classList.remove('visible');
            }
        });
    });

    /* ── Submission ── */
    function showThanks() {
        document.getElementById('fb-form-page').style.display = 'none';
        document.getElementById('fb-success-page').classList.add('visible');
    }

    // On cyberdelic.nexus the lesson runs in a sandboxed frame that can reach no database: it
    // hands the answers to the lesson page, which saves them as the signed-in member and answers
    // LESSON_FEEDBACK_RESULT. Which course they are about, the site reads from its own lesson.
    function sendThroughSite(payload) {
        return new Promise((resolve, reject) => {
            const answers = Object.assign({}, payload);
            delete answers.module;
            const timer = setTimeout(() => { window.removeEventListener('message', onReply); reject(new Error('timeout')); }, 15000);
            function onReply(event) {
                if (event.source !== window.parent || !event.data || event.data.type !== 'LESSON_FEEDBACK_RESULT') return;
                clearTimeout(timer);
                window.removeEventListener('message', onReply);
                if (event.data.ok) resolve(); else reject(new Error(event.data.reason || 'failed'));
            }
            window.addEventListener('message', onReply);
            window.parent.postMessage({ type: 'LESSON_FEEDBACK', feedback: answers }, '*');
        });
    }

    const SUPABASE_URL  = 'https://ncsnucvmemtzwiyebxav.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jc251Y3ZtZW10endpeWVieGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1Mjk1MTYsImV4cCI6MjEwMDEwNTUxNn0.HCS-jw_n952cEUE6Sr901ewrBmMsm-SfRc8xGAEgT0k';

    document.getElementById('fb-submit').addEventListener('click', async () => {
        if (!ratings.overall) {
            document.getElementById('fb-error').classList.add('visible');
            return;
        }

        const btn = document.getElementById('fb-submit');
        btn.disabled = true;
        btn.classList.add('loading');
        btn.querySelector('.fb-submit-text').textContent = 'Sending…';

        const payload = {
            module:                course.key,
            overall_rating:        ratings.overall || null,
            confidence_rating:     ratings.confidence || null,
            most_valuable:         document.getElementById('fb-valuable').value.trim() || null,
            could_improve:         document.getElementById('fb-improve').value.trim() || null,
            additional_comments:   document.getElementById('fb-comments').value.trim() || null
        };

        try {
            if (window.parent !== window) {
                await sendThroughSite(payload);
                showThanks();
                return;
            }
            const res = await fetch(`${SUPABASE_URL}/rest/v1/course_feedback`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON,
                    'Authorization': `Bearer ${SUPABASE_ANON}`,
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const text = await res.text();
                throw new Error(text);
            }

            showThanks();

        } catch (err) {
            console.error('[Feedback] Submission error:', err);
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.querySelector('.fb-submit-text').textContent = 'Submit Feedback';
            document.getElementById('fb-error').textContent = 'Something went wrong. Please try again.';
            document.getElementById('fb-error').classList.add('visible');
        }
    });
})();
</script>
</body>
</html>
